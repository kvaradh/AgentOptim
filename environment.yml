name: admet
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=1.26.4          # pinned below 2.0 -- this RDKit build predates numpy 2.0's release
                          # and breaks on ConvertToNumpyArray if numpy is upgraded past it
  - scikit-learn=1.7.2
  - xgboost=2.0.3
  - pip
  - pip:
      - rdkit==2023.9.6
      - scipy==1.15.3
      - pandas==2.3.3
      - matplotlib==3.10.9
      - PyTDC==1.1.15
      - jupyter==1.1.1
      - nbconvert==7.17.1
      - ipykernel==7.3.0
